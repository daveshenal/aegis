version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aegis-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount app code for hot reload during development
      - ./app:/app/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      - mlflow
    networks:
      - aegis-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: aegis-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    networks:
      - aegis-net

volumes:
  mlflow-data:
    driver: local

networks:
  aegis-net:
    driver: bridge
